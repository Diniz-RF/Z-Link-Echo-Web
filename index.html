<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Link Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-interface">
        <header>
            <h1>Z-Link Echo</h1>
            
            <div class="status-main-container">
                <span id="status-indicator" class="status-idle">PRONTO</span>
            </div>
            
            <div class="central-info">
                <div class="info-block">
                    <span class="label-small">HORÁRIO DO SISTEMA</span>
                    <div id="clock-display">00:00:00</div>
                </div>

                <div class="info-block">
                    <span class="label-small" id="time-label">TEMPO DISPONÍVEL</span>
                    <div id="time-remaining">02:00</div>
                </div>
            </div>
        </header>

        <section class="display-section">
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div class="vu-meter-container">
                <div class="vu-scale">
                    <span>-60</span><span>-40</span><span>-20</span><span>-10</span><span>0 DB</span>
                </div>
                <div class="vu-track">
                    <div id="vu-bar" class="vu-bar"></div>
                    <div id="vu-peak" class="vu-peak"></div>
                </div>
            </div>
        </section>

        <section class="controls-section">
            <div class="control-group">
                <label for="auto-announce">ANÚNCIO AUTOMÁTICO:</label>
                <select id="auto-announce">
                    <option value="OFF">OFF</option>
                    <option value="1M">1 MINUTO</option>
                    <option value="5M">5 MINUTOS</option>
                    <option value="15M">15 MINUTOS</option>
                    <option value="30M">30 MINUTOS</option>
                    <option value="1H">HORA CHEIA</option>
                </select>
            </div>

            <div class="control-group file-group">
                <div class="file-group-header">
                    <label>ÁUDIO DA CHAMADA:</label>
                    <button id="btn-reset-audio" class="btn-reset" title="Restaurar padrão" style="display: none;">⟲ PADRÃO</button>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="custom-audio-input" accept="audio/*" class="hidden-input">
                    <button type="button" id="btn-choose-file" class="btn-file">ARQUIVO</button>
                    <span id="custom-audio-label" class="file-label">CHAMADA PADRÃO</span>
                </div>
            </div>

            <button id="btn-ouvir-hora" class="btn-action">OUVIR HORA AGORA</button>
        </section>

        <div class="dtmf-result-box">
            <span class="label-small">DETECTOR DTMF</span>
            <div id="dtmf-result">AGUARDANDO</div>
        </div>

        <div class="dtmf-debug">
            <div>KEY: <span id="dbg-key">-</span></div>
            <div>ROW: <span id="dbg-row">-</span></div>
            <div>COL: <span id="dbg-col">-</span></div>
            <div>SEQ: <span id="dbg-seq">-</span></div>
        </div>

        <footer>
            <p>Desenvolvido por Diniz-RF</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
