<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Z-Link Echo</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  color: white;
  background: #0b3d91;
  overflow: hidden;
}

/* ===== APP EM TELA CHEIA ===== */
#app {
  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  text-align: center;
  box-sizing: border-box;
  padding: 20px;
}

/* ===== TÍTULO ===== */
#mainTitle {
  margin-bottom: 6vh;
}

#mainTitle h1 {
  margin: 0;
  font-size: 6vw;
  font-weight: bold;
  letter-spacing: 2px;
}

#mainTitle span {
  display: block;
  font-size: 1.5vw;
  opacity: 0.7;
  margin-top: 0.5vh;
}

/* ===== STATUS ===== */
#status {
  font-size: 3vw;
  margin-bottom: 2vh;
}

/* ===== VU ===== */
.vu {
  display: flex;
  gap: 0.4vw;
  margin-bottom: 2vh;
}

.segment {
  width: 0.8vw;
  height: 5vh;
  background: #222;
}

.segment.active { background: lime; }
.segment.mid { background: yellow; }
.segment.high { background: red; }
.segment.peak { background: white !important; }

/* ===== TIMER ===== */
#timerBox {
  text-align: center;
}

#timerLabel {
  font-size: 1.5vw;
}

#timer {
  font-size: 3vw;
  font-weight: bold;
}

#timeBarContainer {
  width: 30vw;
  height: 0.8vh;
  background: rgba(255,255,255,0.2);
  margin-top: 1vh;
  border-radius: 3px;
  overflow: hidden;
}

#timeBar {
  height: 100%;
  width: 100%;
}

/* ===== ANIMAÇÕES ===== */
.blink {
  animation: blink 1s infinite;
}
@keyframes blink {
  50% { opacity: 0.3; }
}

.pulse {
  animation: pulse 1s infinite;
}
@keyframes pulse {
  50% { filter: brightness(1.5); }
}

.alert {
  animation: alertPulse 0.8s infinite;
}
@keyframes alertPulse {
  0% { opacity: 1; }
  50% { opacity: 0.3; }
  100% { opacity: 1; }
}
</style>
</head>

<body id="body">

<div id="app">

  <div id="mainTitle">
    <h1>Z-Link Echo</h1>
    <span>desenvolvido por Diniz-RF</span>
  </div>

  <div id="status">PRONTO</div>

  <div class="vu" id="vu"></div>

  <div id="timerBox">
    <div id="timerLabel">TEMPO DISPONÍVEL</div>
    <div id="timer">02:00</div>

    <div id="timeBarContainer">
      <div id="timeBar"></div>
    </div>
  </div>

</div>

<audio id="audioPlayer"></audio>

<script>
let mediaRecorder, audioChunks=[];
let isRecording=false, isBusy=false;
let currentSource=null;
let timeExpired=false;
let blockKey=false;
let pendingAudio=null;

const MAX_TIME = 120;

let countdownInterval=null;
let playRAF=null;
let timeLeft=MAX_TIME;

const body=document.getElementById("body");
const statusText=document.getElementById("status");
const audioPlayer=document.getElementById("audioPlayer");

const timerText=document.getElementById("timer");
const timerLabel=document.getElementById("timerLabel");
const timeBar=document.getElementById("timeBar");

const audioContext=new (window.AudioContext||window.webkitAudioContext)();

let micAnalyser, playerAnalyser;
let micData, playerData;

// ===== VU =====
let smooth = 0;
let maxLevel = 0.05;
let peakLevel = 0;
let peakHoldTime = 0;

const vu=document.getElementById("vu");
for(let i=0;i<20;i++){
  const s=document.createElement("div");
  s.className="segment";
  vu.appendChild(s);
}
const segments=document.querySelectorAll(".segment");

function getColor(percent){
  if(percent>50) return "lime";
  if(percent>20) return "yellow";
  return "red";
}

function setState(state){
  body.classList.remove("pulse");
  statusText.classList.remove("alert");

  if(state==="idle"){
    body.style.background="#0b3d91";
    statusText.innerText="PRONTO";
    currentSource=null;

    timerLabel.innerText="TEMPO DISPONÍVEL";
    timerText.innerText="02:00";
    timerText.classList.remove("blink");

    timeBar.style.width="100%";
    timeBar.style.background=getColor(100);
  }

  if(state==="receiving"){
    body.style.background="#0f7a2f";
    statusText.innerText="RECEBENDO";
    currentSource="mic";
    timerLabel.innerText="TEMPO RESTANTE";
  }

  if(state==="transmitting"){
    body.style.background="#a30000";
    statusText.innerText="TRANSMITINDO";
    body.classList.add("pulse");
    currentSource="player";
    timerLabel.innerText="TEMPO DECORRIDO";
  }
}

// ===== CONTADOR =====
function startCountdown(){
  timeLeft=MAX_TIME;
  timeExpired=false;

  countdownInterval=setInterval(()=>{
    timeLeft--;

    let m=String(Math.floor(timeLeft/60)).padStart(2,'0');
    let s=String(timeLeft%60).padStart(2,'0');
    timerText.innerText=`${m}:${s}`;

    let percent=(timeLeft/MAX_TIME)*100;

    timeBar.style.width=percent+"%";
    timeBar.style.background=getColor(percent);

    if(timeLeft<=10) timerText.classList.add("blink");

    if(timeLeft<=0){
      clearInterval(countdownInterval);

      timeExpired = true;
      blockKey = true;

      statusText.innerText = "TEMPO ESGOTADO";
      statusText.classList.add("alert");

      body.style.background = "#ff8c00";

      if(isRecording){
        mediaRecorder.stop();
        isRecording=false;
      }
    }

  },1000);
}

function stopCountdown(){
  clearInterval(countdownInterval);
}

// ===== REPRODUÇÃO =====
async function playAudio(blob){
  stopCountdown();

  timerText.classList.remove("blink");
  timerText.innerText="00:00";
  timeBar.style.width="0%";

  audioPlayer.src=URL.createObjectURL(blob);

  isBusy=true;

  await playTone(18500,300);

  setState("transmitting");
  await audioPlayer.play();

  function update(){
    let current=audioPlayer.currentTime;
    let duration=audioPlayer.duration||1;

    let percent=(current/duration)*100;

    let m=String(Math.floor(current/60)).padStart(2,'0');
    let s=String(Math.floor(current%60)).padStart(2,'0');

    timerText.innerText=`${m}:${s}`;
    timeBar.style.width=percent+"%";
    timeBar.style.background="lime";

    if(!audioPlayer.paused){
      playRAF=requestAnimationFrame(update);
    }
  }

  update();

  audioPlayer.onended=async ()=>{
    cancelAnimationFrame(playRAF);

    await playTone(17500,300);

    isBusy=false;
    setState("idle");
  };
}

// ===== VU =====
function updateVU(){
  let analyser,data;

  if(currentSource==="mic"){
    analyser=micAnalyser;
    data=micData;
  }
  if(currentSource==="player"){
    analyser=playerAnalyser;
    data=playerData;
  }

  let active = 0;

  if(analyser){
    analyser.getByteTimeDomainData(data);

    let sum=0;
    for(let i=0;i<data.length;i++){
      let v=(data[i]-128)/128;
      sum+=v*v;
    }

    let rms=Math.sqrt(sum/data.length);

    const noiseThreshold = 0.02;
    if(rms < noiseThreshold) rms = 0;

    if(rms > maxLevel){
      maxLevel = rms;
    } else {
      maxLevel *= 0.995;
      if(maxLevel < 0.02) maxLevel = 0.02;
    }

    let normalized = rms / maxLevel;
    if(!isFinite(normalized)) normalized = 0;
    if(normalized > 1) normalized = 1;

    let level = normalized * segments.length;

    smooth += (level - smooth) * 0.5;

    if(rms === 0) smooth *= 0.8;

    active = Math.floor(smooth);
  }

  segments.forEach(s=>s.className="segment");

  segments.forEach((s,i)=>{
    if(i<active){
      s.classList.add("active");
      if(i>12)s.classList.add("high");
      else if(i>7)s.classList.add("mid");
    }
  });

  if(active > peakLevel){
    peakLevel = active;
    peakHoldTime = 15;
  } else {
    if(peakHoldTime > 0){
      peakHoldTime--;
    } else {
      peakLevel -= 0.4;
      if(peakLevel < 0) peakLevel = 0;
    }
  }

  let pIndex = Math.floor(peakLevel);
  if(segments[pIndex]){
    segments[pIndex].classList.add("peak");
  }

  requestAnimationFrame(updateVU);
}

// ===== INIT =====
async function init(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  const mic=audioContext.createMediaStreamSource(stream);
  micAnalyser=audioContext.createAnalyser();
  micAnalyser.fftSize=512;
  mic.connect(micAnalyser);
  micData=new Uint8Array(micAnalyser.fftSize);

  mediaRecorder=new MediaRecorder(stream);

  mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);

  mediaRecorder.onstop=()=>{
    const blob=new Blob(audioChunks,{type:"audio/webm"});
    audioChunks=[];

    pendingAudio = blob;

    if(!timeExpired){
      playAudio(blob);
      pendingAudio=null;
    }
  };

  const playerSource=audioContext.createMediaElementSource(audioPlayer);
  playerAnalyser=audioContext.createAnalyser();
  playerAnalyser.fftSize=512;

  const gain=audioContext.createGain();
  gain.gain.value=2;

  playerSource.connect(playerAnalyser);
  playerAnalyser.connect(gain);
  gain.connect(audioContext.destination);

  playerData=new Uint8Array(playerAnalyser.fftSize);

  updateVU();
  setState("idle");
}

init();

// ===== F7 =====
document.addEventListener("keydown", async (e)=>{
  if(e.repeat || blockKey) return;

  if(e.code==="F7" && !isRecording && !isBusy && !timeExpired){

    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }

    mediaRecorder.start();
    isRecording=true;
    setState("receiving");
    startCountdown();
  }
});

document.addEventListener("keyup",(e)=>{
  if(e.code==="F7"){

    if(isRecording){
      mediaRecorder.stop();
      isRecording=false;
    }

    if(timeExpired && pendingAudio){
      playAudio(pendingAudio);
      pendingAudio=null;
      timeExpired=false;
    }

    blockKey=false;
  }
});

// ===== TOM =====
function playTone(freq,dur){
  return new Promise(res=>{
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    gain.gain.value=0.1;
    osc.frequency.value=freq;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();
    setTimeout(()=>{
      osc.stop();
      res();
    },dur);
  });
}
</script>

</body>
</html>
